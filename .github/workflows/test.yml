name: Test

on:
  pull_request:

jobs:
  test-unit:
    runs-on: depot-ubuntu-24.04-4
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 ## v7.0.1

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e ## v7.0.0
      with:
        go-version: '1.26.10'

    - name: Run unit tests
      run: |
        make test-unit